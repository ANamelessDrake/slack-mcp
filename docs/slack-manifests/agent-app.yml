# Template for one agent app. Create one Slack app per agent (replace AGENT_NAME),
# so each agent has its own real, mention-able bot identity in the workspace.
# Send-only by default; the optional blocks below enable two-way DMs.
display_information:
  name: AGENT_NAME
  description: LLM agent posting via slack-mcp
  background_color: "#4a154b"
features:
  bot_user:
    display_name: AGENT_NAME
    always_online: false
  # Two-way DMs: let people type in the agent's Messages tab.
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - chat:write
      # Posting file attachments with send_message (outbound uploads).
      - files:write
      - im:write
      # Listing the agent's own DMs (list_dms, find_user dm_channel_id).
      - im:read
      # Group DMs (multi-person DMs): the agent participates directly, so its own
      # app lists them (mpim:read) and pulls their history (mpim:history).
      # check_messages polls a named group DM with this token; Slack does not
      # deliver message.mpim to bots, so there is no group-DM event to subscribe.
      - mpim:history
      - mpim:read
      # Only needed for two-way DMs: the relay cannot see files in an
      # agent's DM, so the agent reads its own DM attachments.
      - files:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  # Two-way DMs: uncomment after storing this app's signing secret
  # ({Env}-{Project}-SigningSecret-<agent_id>) so ingest can verify the
  # URL-verification ping. Same request URL as the relay app. (Group DMs need no
  # event here: they are polled on demand, not pushed.)
  # event_subscriptions:
  #   request_url: https://REPLACE-WITH-INGEST-FUNCTION-URL/
  #   bot_events:
  #     - message.im
