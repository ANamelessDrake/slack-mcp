# Relay app: the single event subscriber and reader for the slack-mcp system.
# Create at https://api.slack.com/apps > Create New App > From an app manifest.
display_information:
  name: slack-relay
  description: Event ingest and read relay for the slack-mcp agent system
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: slack-relay
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:read
      - channels:history
      - groups:read      # private channels the relay is invited to
      - groups:history
      - im:history
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  # Uncomment after the ingest Lambda is deployed, then verify the URL.
  # event_subscriptions:
  #   request_url: https://REPLACE-WITH-INGEST-FUNCTION-URL/
  #   bot_events:
  #     - message.channels
  #     - message.groups
  #     - message.im
